    .toast {

      color: #f4efe6;
      padding: 0.5rem 0.8rem;
      font-size: 0.8rem;
      opacity: 0;
      pointer-events: none;

<body>

    <button type="button" data-copy="0548b3c2be496218baa2314386787badfd458a868240a19ede82eabb6a13dd2c26">Session</button>
  </div>
  <div class="toast" id="toast">Copied ID to clipboard</div>
  <script>
    const ID = "0548b3c2be496218baa2314386787badfd458a868240a19ede82eabb6a13dd2c26";
    const toast = document.getElementById("toast");
    function copyId() {
      navigator.clipboard.writeText(ID).then(() => {
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1600);
      });
    }
    document.querySelectorAll("[data-copy]").forEach(el => el.addEventListener("click", copyId));
  </script>
